[alembic]
script_location = alembic

# sqlalchemy.url is deliberately omitted here — alembic/env.py reads the
# live DATABASE_URL (via python-dotenv + os.environ) instead, so there's one
# source of truth for the connection string, matching every other entry
# point in this project (cli.py, flows/daily_report.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
