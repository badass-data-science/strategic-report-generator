[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-reports"
version = "0.1.0"
description = "Daily strategic intelligence reports generated from RSS feeds via LLM summarization and tag-graph analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.80.0",
    "instructor>=1.15.0",
    "tenacity>=9.0.0",
    "pydantic>=2.0.0",
    "feedparser>=6.0.0",
    "html-to-markdown>=1.0.0",
    "structlog>=26.0.0",
    "jinja2>=3.1.0",
    "networkx>=3.0.0",
    "typer>=0.16.0",
    "rdflib>=7.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
flow = ["prefect>=3.0.0"]
test = ["pytest>=9.0.0", "pytest-asyncio>=1.0.0"]
lint = ["ruff>=0.16.0"]
typecheck = ["mypy>=2.3.0", "types-networkx>=3.0.0"]

[project.scripts]
strategic-reports = "strategic_reports.daily.cli:app"

[tool.setuptools.packages.find]
include = ["strategic_reports*"]

[tool.setuptools.package-data]
strategic_reports = ["py.typed"]
"strategic_reports.daily" = ["data/rss_feeds/*.json", "templates/*.j2"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["strategic_reports", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Imports deliberately placed after configure_logging()'s definition -- see
# the module docstring for why.
"strategic_reports/daily/core/__init__.py" = ["E402"]
# load_dotenv() must run before any module-level os.environ.get() reads
# further down the file, so it's deliberately placed between import blocks.
"strategic_reports/daily/cli.py" = ["E402"]
"strategic_reports/daily/flows/daily_report.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["strategic_reports", "tests"]

[[tool.mypy.overrides]]
# feedparser has no published type stubs. phoenix/openinference/opentelemetry
# are optional tracing dependencies (see tracing.py), never installed in the
# base/test/typecheck environment -- imported inside a try/except precisely
# so their absence is a supported, runtime-safe configuration.
module = [
    "feedparser",
    "phoenix",
    "openinference.instrumentation.litellm",
    "opentelemetry.*",
]
ignore_missing_imports = true
